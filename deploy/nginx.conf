# /etc/nginx/sites-available/pixelforge-demo.johnpretsch.com
# Reference copy of the installed config. The "managed by Certbot" lines (TLS
# listeners + HTTP→HTTPS redirect) were added by:
#   certbot --nginx -d pixelforge-demo.johnpretsch.com --redirect
# Renewal is handled by the server's certbot.timer.
server {
    server_name pixelforge-demo.johnpretsch.com;

    root /var/www/pixelforge-demo.johnpretsch.com/public;
    index index.php;

    charset utf-8;
    client_max_body_size 2M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Fingerprinted Vite assets: cache aggressively.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # No other PHP file under public/ is executable, and dotfiles are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    error_page 404 /index.php;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pixelforge-demo.johnpretsch.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pixelforge-demo.johnpretsch.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = pixelforge-demo.johnpretsch.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pixelforge-demo.johnpretsch.com;
    return 404; # managed by Certbot


}
